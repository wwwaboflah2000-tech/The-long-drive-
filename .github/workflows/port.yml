name: The Long Drive Android Porter

on:
  workflow_dispatch:

jobs:
  prepare-and-inspect:
    runs-on: ubuntu-latest

    steps:
      # 1. إعداد بيئة النظام وتثبيت أدوات التحميل وفك الضغط
      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip p7zip-full python3-pip
          pip install --upgrade gdown unitypy

      # 2. تحميل الملف مباشرة عبر كود Python الداخلي (بدون مشاكل الوسوم)
      - name: Download Archive from Google Drive
        run: |
          echo "[+] Downloading file from Google Drive via Python API..."
          python3 -c "import gdown; gdown.download(id='1lvXuAKT4h7ttYBKR16Nl0DneOw8JpXWd', output='input_game.jar', quiet=False)"
          echo "[+] Download finished! Checking file:"
          ls -lh input_game.jar

      # 3. فك ضغط ملف الـ .jar واستعراض محتوياته بدقة
      - name: Extract and Inspect Contents
        run: |
          echo "[+] Extracting .jar archive..."
          mkdir -p workspace/
          unzip -q input_game.jar -d workspace/ || 7z x input_game.jar -oworkspace/
          
          echo "[+] Root files in workspace:"
          ls -la workspace/
          
          # البحث التلقائي عن مجلد البيانات _Data
          DATA_DIR=$(find workspace/ -maxdepth 2 -type d -name "*_Data" | head -n 1)
          if [ -n "$DATA_DIR" ]; then
            echo "[SUCCESS] Found Game Data Directory at: $DATA_DIR"
            ls -lh "$DATA_DIR"
          fi

      # 4. تنظيف إعدادات الإقلاع boot.config لمنع انهيار اللعبة على الهاتف
      - name: Patch boot.config (Strip VR / OpenXR)
        run: |
          BOOT_FILE=$(find workspace/ -name "boot.config" | head -n 1)
          if [ -f "$BOOT_FILE" ]; then
            echo "[+] Found boot.config at: $BOOT_FILE"
            # حذف أسطر الواقع الافتراضي OpenXR التي تغلق اللعبة على هواتف الأندرويد
            sed -i '/xrsdk-pre-init-library/d' "$BOOT_FILE"
            # إضافة إعدادات التزامن وتثبيت الفريمات للشاشات
            echo "vrr-rate-limit=60" >> "$BOOT_FILE"
            echo "target-frame-rate=60" >> "$BOOT_FILE"
            echo "[SUCCESS] Patched boot.config content:"
            cat "$BOOT_FILE"
          else
            echo "[!] Notice: boot.config not found directly."
          fi
